<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Shop Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            background: #8aa9e8;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            🏪
        </div>

        <h1>Shop Management</h1>

        <p class="subtitle">
            Admin Login
        </p>

        <form onsubmit="login(event)">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="footer">
            Shop Management System
        </div>

    </div>


    <script>

        async function login(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");

            const loginButton =
                document.getElementById("loginButton");


            message.style.display = "none";


            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";


            try {

                const response = await fetch("/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });


                const data = await response.json();


                if (response.ok) {

                    message.className =
                        "message success";

                    message.textContent =
                        "Login successful!";

                    message.style.display =
                        "block";


                    /*
                        Login information temporarily
                        browser session میں save کریں۔
                    */

                    sessionStorage.setItem(
                        "admin_id",
                        data.admin_id
                    );

                    sessionStorage.setItem(
                        "username",
                        data.username
                    );


                    setTimeout(function () {

                        window.location.href =
                            "dashboard.html";

                    }, 500);


                } else {

                    message.className =
                        "message error";

                    message.textContent =
                        data.detail ||
                        "Invalid username or password";

                    message.style.display =
                        "block";

                }


            } catch (error) {

                message.className =
                    "message error";

                message.textContent =
                    "Server connection error. Please try again.";

                message.style.display =
                    "block";

                console.error(error);

            }


            loginButton.disabled = false;
            loginButton.textContent = "Login";

        }

    </script>

</body>
</html>
